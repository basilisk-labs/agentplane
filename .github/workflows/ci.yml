name: Core CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact Git commit SHA to validate for release recovery (preferred over ref)"
        required: false
      ref:
        description: "Git ref to validate only when sha is omitted"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AGENTPLANE_CI_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sha != '' && github.event.inputs.sha || github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}
  AGENTPLANE_RELEASE_RECOVERY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sha != '' && github.event.inputs.sha || '' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.plan.outputs.core }}
      route: ${{ steps.plan.outputs.route }}
      selector_kind: ${{ steps.plan.outputs.selector_kind }}
      bucket: ${{ steps.plan.outputs.bucket }}
      buckets: ${{ steps.plan.outputs.buckets }}
      needs_recipes_inventory: ${{ steps.plan.outputs.needs_recipes_inventory }}
      needs_workflow_lint: ${{ steps.plan.outputs.needs_workflow_lint }}
      docs: ${{ steps.plan.outputs.docs }}
      dependency_review: ${{ steps.plan.outputs.dependency_review }}
      workflow_lint: ${{ steps.plan.outputs.workflow_lint }}
      windows: ${{ steps.plan.outputs.windows }}
      coverage: ${{ steps.plan.outputs.coverage }}
      cli_critical: ${{ steps.plan.outputs.cli_critical }}
      package_runtime: ${{ steps.plan.outputs.package_runtime }}
      package_runtime_core: ${{ steps.plan.outputs.package_runtime_core }}
      package_runtime_recipes: ${{ steps.plan.outputs.package_runtime_recipes }}
      security: ${{ steps.plan.outputs.security }}
      codeql_languages: ${{ steps.plan.outputs.codeql_languages }}
      release_ready: ${{ steps.plan.outputs.release_ready }}
      exact_sha_recovery: ${{ steps.plan.outputs.exact_sha_recovery }}
      expected_jobs: ${{ steps.plan.outputs.expected_jobs }}
      executing_jobs_count: ${{ steps.plan.outputs.executing_jobs_count }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      changed_files: ${{ steps.plan.outputs.changed_files }}
      changed_files_count: ${{ steps.plan.outputs.changed_files_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Plan PR verification route
        id: plan
        run: node scripts/checks/plan-github-ci.mjs

  verify-routed:
    needs: plan
    if: >-
      needs.plan.outputs.core == 'true' &&
      needs.plan.outputs.route != 'full-fast'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
          fetch-depth: 0
      - name: Initialize recipes submodule
        if: needs.plan.outputs.needs_recipes_inventory == 'true'
        run: git submodule update --init agentplane-recipes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install actionlint
        if: needs.plan.outputs.needs_workflow_lint == 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Cache Bun artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Compatibility baseline (check)
        run: bun run bench:compatibility:check
      - name: Agent-efficiency baseline (check)
        run: bun run bench:agent-efficiency:check
      - name: Agent-efficiency replay baseline (check)
        run: bun run bench:agent-efficiency:replay:check
      - name: Routed local CI
        env:
          AGENTPLANE_FAST_CHANGED_FILES: ${{ needs.plan.outputs.changed_files }}
        run: bun run ci:local:fast

  verify-contract:
    needs: plan
    if: >-
      needs.plan.outputs.core == 'true' &&
      needs.plan.outputs.route == 'full-fast'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install actionlint
        if: needs.plan.outputs.workflow_lint == 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Cache Bun artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install website dependencies
        if: needs.plan.outputs.docs == 'true'
        run: bun install --cwd website --frozen-lockfile --ignore-scripts
      - name: Format (check)
        run: bun run format:check
      - name: Schemas (check)
        run: bun run schemas:check
      - name: Agent templates (check)
        run: bun run agents:check
      - name: Release parity (check)
        run: bun run release:parity
      - name: Compatibility baseline (check)
        run: bun run bench:compatibility:check
      - name: Agent-efficiency baseline (check)
        run: bun run bench:agent-efficiency:check
      - name: Agent-efficiency replay baseline (check)
        run: bun run bench:agent-efficiency:replay:check
      - name: Build packages (dist + manifests)
        run: |
          bun run --filter=@agentplaneorg/core build
          bun run --filter=agentplane build
          bun run --filter=@agentplane/testkit build
      - name: AgentPlane workflow contract
        run: |
          node packages/agentplane/bin/agentplane.js workflow build --validate --dry-run
          node packages/agentplane/bin/agentplane.js workflow build --validate
          node packages/agentplane/bin/agentplane.js doctor
      - name: CLI docs (generated reference check)
        run: bun run docs:cli:check
      - name: Hotspot Threshold (check)
        run: bun run hotspots:check
      - name: Docs site contract
        if: needs.plan.outputs.docs == 'true'
        run: bun run docs:site:check
      - name: Workflow lint and command contract
        if: needs.plan.outputs.workflow_lint == 'true'
        run: bun run workflows:lint

  verify-package-node-runtime:
    name: Package runtime
    needs: plan
    if: needs.plan.outputs.package_runtime == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Use supported build runtime
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and pack core
        if: needs.plan.outputs.package_runtime_core == 'true'
        working-directory: packages/core
        run: |
          mkdir -p "$RUNNER_TEMP/package-node-runtime"
          npm pack --json --pack-destination "$RUNNER_TEMP/package-node-runtime"
      - name: Build and pack recipes
        if: needs.plan.outputs.package_runtime_recipes == 'true'
        working-directory: packages/recipes
        run: |
          mkdir -p "$RUNNER_TEMP/package-node-runtime"
          npm pack --json --pack-destination "$RUNNER_TEMP/package-node-runtime"
      - name: Use minimum core runtime
        if: needs.plan.outputs.package_runtime_core == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20.5.0"
      - name: Exercise core public API on Node 20.5
        if: needs.plan.outputs.package_runtime_core == 'true'
        run: >-
          node scripts/release/check-package-node-runtime.mjs
          --package-dir packages/core
          --tarball-dir "$RUNNER_TEMP/package-node-runtime"
      - name: Use current core runtime
        if: needs.plan.outputs.package_runtime_core == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Exercise core public API on Node 24
        if: needs.plan.outputs.package_runtime_core == 'true'
        run: >-
          node scripts/release/check-package-node-runtime.mjs
          --package-dir packages/core
          --tarball-dir "$RUNNER_TEMP/package-node-runtime"
      - name: Use minimum recipes runtime
        if: needs.plan.outputs.package_runtime_recipes == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20.0.0"
      - name: Exercise recipes public API on Node 20
        if: needs.plan.outputs.package_runtime_recipes == 'true'
        run: >-
          node scripts/release/check-package-node-runtime.mjs
          --package-dir packages/recipes
          --tarball-dir "$RUNNER_TEMP/package-node-runtime"
      - name: Use current recipes runtime
        if: needs.plan.outputs.package_runtime_recipes == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Exercise recipes public API on Node 24
        if: needs.plan.outputs.package_runtime_recipes == 'true'
        run: >-
          node scripts/release/check-package-node-runtime.mjs
          --package-dir packages/recipes
          --tarball-dir "$RUNNER_TEMP/package-node-runtime"

  verify-static:
    needs: plan
    if: >-
      needs.plan.outputs.core == 'true' &&
      needs.plan.outputs.route == 'full-fast'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Cache Bun artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build packages (dist + manifests)
        run: |
          bun run --filter=@agentplaneorg/core build
          bun run --filter=agentplane build
          bun run --filter=@agentplane/testkit build
          bun run --filter=@agentplaneorg/recipes build
      - name: Lint
        run: bun run lint:core
      - name: Architecture boundaries
        run: bun run arch:check
      - name: Dead code baseline (blocking)
        run: bun run knip:check

  verify-tests:
    needs: plan
    if: >-
      needs.plan.outputs.core == 'true' &&
      needs.plan.outputs.route == 'full-fast'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_AUTHOR_NAME: agentplane-ci
      GIT_AUTHOR_EMAIL: agentplane-ci@example.com
      GIT_COMMITTER_NAME: agentplane-ci
      GIT_COMMITTER_EMAIL: agentplane-ci@example.com
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Cache Bun artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build packages (dist + manifests)
        run: |
          bun run --filter=@agentplaneorg/core build
          bun run --filter=agentplane build
          bun run --filter=@agentplane/testkit build
          bun run --filter=@agentplaneorg/recipes build
      - name: Unit Tests (Fast)
        run: bun run test:fast:ci
      - name: CLI E2E (Critical)
        if: needs.plan.outputs.cli_critical == 'true'
        timeout-minutes: 10
        run: bun run test:critical
      - name: Workflow/Harness Coverage (guard)
        if: needs.plan.outputs.coverage == 'true'
        run: bun run coverage:workflow-suite
      - name: Significant File Coverage (guard)
        if: needs.plan.outputs.coverage == 'true'
        run: bun run coverage:significant-suite

  test-windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Cache Bun artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Schemas (check)
        run: bun run schemas:check
      - name: Agent templates (check)
        run: bun run agents:check
      - name: Release parity (check)
        run: bun run release:parity
      - name: Build packages (dist + manifests)
        run: |
          bun run --filter=@agentplaneorg/core build
          bun run --filter=agentplane build
          bun run --filter=@agentplane/testkit build
      - name: Unit tests (platform-critical)
        run: bun run test:platform-critical
        env:
          GIT_AUTHOR_NAME: agentplane-ci
          GIT_AUTHOR_EMAIL: agentplane-ci@example.com
          GIT_COMMITTER_NAME: agentplane-ci
          GIT_COMMITTER_EMAIL: agentplane-ci@example.com

  verify-docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true' && needs.plan.outputs.route != 'full-fast'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Cache Bun artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
          key: ${{ runner.os }}-docs-bun-${{ hashFiles('bun.lock', 'website/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-docs-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --cwd website --frozen-lockfile --ignore-scripts
      - name: Docs site contract
        run: bun run docs:site:check

  verify-security:
    needs: plan
    if: needs.plan.outputs.security == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
          fetch-depth: 0
      - name: Review dependency changes
        if: needs.plan.outputs.dependency_review == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
      - name: Initialize CodeQL
        if: needs.plan.outputs.codeql_languages != ''
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ needs.plan.outputs.codeql_languages }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze source and workflow code
        if: needs.plan.outputs.codeql_languages != ''
        uses: github/codeql-action/analyze@v4

  recovery-validate:
    needs: plan
    if: needs.plan.outputs.exact_sha_recovery == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Cache Bun artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Release parity (check)
        run: bun run release:parity
      - name: Build packages (dist + manifests)
        run: |
          bun run --filter=@agentplaneorg/core build
          bun run --filter=agentplane build
          bun run --filter=@agentplane/testkit build

  release-ready:
    name: Release-ready manifest
    needs:
      - plan
      - verify-routed
      - verify-contract
      - verify-package-node-runtime
      - verify-static
      - verify-tests
      - verify-docs
      - verify-security
      - test-windows
      - recovery-validate
    if: >-
      always() &&
      needs.plan.outputs.release_ready == 'true' &&
      (
        (
          needs.plan.outputs.exact_sha_recovery == 'true' &&
          needs.recovery-validate.result == 'success'
        ) ||
        (
          needs.plan.outputs.exact_sha_recovery != 'true' &&
          (
            needs.plan.outputs.core != 'true' ||
            (needs.plan.outputs.route != 'full-fast' && needs.verify-routed.result == 'success') ||
            (
              needs.plan.outputs.route == 'full-fast' &&
              needs.verify-contract.result == 'success' &&
              needs.verify-static.result == 'success' &&
              needs.verify-tests.result == 'success'
            )
          ) &&
          (needs.plan.outputs.package_runtime != 'true' || needs.verify-package-node-runtime.result == 'success') &&
          (needs.plan.outputs.docs != 'true' || needs.plan.outputs.route == 'full-fast' || needs.verify-docs.result == 'success') &&
          (needs.plan.outputs.security != 'true' || needs.verify-security.result == 'success') &&
          (needs.plan.outputs.windows != 'true' || needs.test-windows.result == 'success')
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
      - name: Resolve release-ready target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Release incidents (check)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/check-release-incidents.mjs ]; then
            node scripts/check-release-incidents.mjs
          else
            echo "release incident gate skipped: target ref predates scripts/check-release-incidents.mjs"
          fi
      - name: Generate release-ready manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agentplane/.release/ready
          node scripts/manifest.mjs release-ready \
            --out .agentplane/.release/ready/release-ready.json \
            --sha "${{ steps.target.outputs.sha }}" \
            --ref "${AGENTPLANE_CI_REF}" \
            --check-registry
          READY="$(node -e "const fs=require('node:fs'); const payload=JSON.parse(fs.readFileSync('.agentplane/.release/ready/release-ready.json','utf8')); process.stdout.write(payload.ready ? 'true' : 'false');")"
          echo "ready=${READY}" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('node:fs'); const payload=JSON.parse(fs.readFileSync('.agentplane/.release/ready/release-ready.json','utf8')); console.log(payload.message);"
      - name: Upload release-ready artifact
        if: steps.manifest.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-ready
          path: .agentplane/.release/ready/release-ready.json
          if-no-files-found: error
      - name: Upload exact-sha release-ready artifact
        if: steps.manifest.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-ready-${{ steps.target.outputs.sha }}
          path: .agentplane/.release/ready/release-ready.json
          if-no-files-found: error

  pr-verification:
    name: PR verification
    needs:
      - plan
      - verify-routed
      - verify-contract
      - verify-package-node-runtime
      - verify-static
      - verify-tests
      - verify-docs
      - verify-security
      - test-windows
      - recovery-validate
      - release-ready
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AGENTPLANE_CI_REF }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Evaluate aggregate verification
        env:
          AGENTPLANE_CI_PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          AGENTPLANE_CI_RESULTS_JSON: >-
            {"plan":"${{ needs.plan.result }}","verify-routed":"${{ needs.verify-routed.result }}","verify-contract":"${{ needs.verify-contract.result }}","verify-package-node-runtime":"${{ needs.verify-package-node-runtime.result }}","verify-static":"${{ needs.verify-static.result }}","verify-tests":"${{ needs.verify-tests.result }}","verify-docs":"${{ needs.verify-docs.result }}","verify-security":"${{ needs.verify-security.result }}","test-windows":"${{ needs.test-windows.result }}","recovery-validate":"${{ needs.recovery-validate.result }}","release-ready":"${{ needs.release-ready.result }}"}
        run: node scripts/checks/evaluate-github-ci.mjs
